{% extends 'base.html' %}{% block content %}<div class="eyebrow">COMPETITION</div><h1>Leaderboard <span class="accent">↗</span></h1><p>Every solved challenge moves you up the rankings.</p><div class="card"><table><thead><tr><th>Rank</th><th>Player</th><th>Solves</th><th>Points</th></tr></thead><tbody>{% for username, points, solved in scores %}<tr><td>#{{ loop.index }}</td><td>{{ username }}</td><td>{{ solved }}</td><td class="points">{{ points }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
